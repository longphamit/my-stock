<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Analytics — Hệ Thống Phân Tích & Dự Báo Cổ Phiếu Việt Nam</title>
    <meta name="description" content="Hệ thống phân tích và dự báo cổ phiếu thị trường chứng khoán Việt Nam sử dụng AI/ML. Dữ liệu thời gian thực VN100, VNAllShare.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js Annotation Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>


    <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <div class="logo">
            <div class="logo-icon-wrap">
                <i class="fa-solid fa-chart-line"></i>
            </div>
            <div class="logo-text">
                <h1>AI STOCK ANALYTICS</h1>
                <div class="logo-sub">Phân tích & dự báo cổ phiếu VN</div>
            </div>
        </div>

        <!-- Navigation Topbar Tabs -->
        <div class="tab-group" id="header-nav-tabs">
            <a href="/gold" class="tab-btn {% if active_page == 'gold_price' %}active{% endif %}" id="tab-gold-list">
                <i class="fa-solid fa-coins" style="color: #fbbf24; margin-right: 2px;"></i> Giá Vàng
            </a>
            <a href="/gold/prediction" class="tab-btn {% if active_page == 'gold_pred' %}active{% endif %}" id="tab-gold-prediction">
                <i class="fa-solid fa-brain" style="color: #fbbf24; margin-right: 2px;"></i> Dự Báo Vàng
            </a>
            <a href="/stocks" class="tab-btn {% if active_page == 'stocks' %}active{% endif %}" id="tab-stocks-main">
                <i class="fa-solid fa-chart-line" style="color: #34d399; margin-right: 2px;"></i> Cổ Phiếu
            </a>
            <a href="/vietlott" class="tab-btn {% if active_page == 'vietlott' %}active{% endif %}" id="tab-vietlott-list">
                <i class="fa-solid fa-ticket" style="color: #f43f5e; margin-right: 2px;"></i> Xổ Số
            </a>
        </div>

        <div class="header-right">
            <!-- Live clock + status -->
            <div class="header-status" id="header-status-block" style="padding: 0.35rem 0.75rem; min-width: 105px;">
                <!-- Keep hidden elements for JS compatibility -->
                <span id="status-dot" style="display: none;"></span>
                <span id="status-label" style="display: none;"></span>
                
                <div class="status-info" style="gap: 2px; width: 100%;">
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; line-height: 1.2;">
                        <span style="color: var(--text-muted); font-weight: 600;">VN:</span>
                        <span id="live-clock-vn" style="font-weight: 500; color: var(--text-primary);">--:--:--</span>
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; line-height: 1.2;">
                        <span style="color: var(--text-muted); font-weight: 600;">US:</span>
                        <span id="live-clock-us" style="font-weight: 500; color: #fbbf24;">--:--:--</span>
                    </div>
                </div>
            </div>

            <!-- Search -->
            <form id="search-form" class="search-container" onsubmit="handleHeaderSearch(event)">
                <i class="fa-solid fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Tìm mã cổ phiếu..." autocomplete="off">
            </form>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="main-container">
        <!-- LEFT SIDEBAR -->
        <section class="glass-panel" id="left-sidebar" aria-label="Thanh bên">
            {% block sidebar %}{% endblock %}
        </section>

        <!-- RIGHT DETAIL PANEL -->
        <section class="glass-panel" id="detail-card-panel" aria-label="Bảng điều khiển chính">
            {% block content %}{% endblock %}
        </section>
    </main>


    <!-- TOAST -->
    <div class="toast" id="toast-notification" role="alert" aria-live="assertive">
        <i id="toast-icon" class="fa-solid fa-circle-info" style="flex-shrink:0"></i>
        <span class="toast-msg" id="toast-message">Đã cập nhật dữ liệu thành công.</span>
    </div>

    <!-- JAVASCRIPT -->
    <script src="/static/js/common.js?v={{ range(1, 100000) | random }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
